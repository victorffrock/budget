version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # init e analyze do CodeQL precisam usar a mesma versão. Agrupar essas
    # atualizações evita pull requests individuais que falham na validação.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
