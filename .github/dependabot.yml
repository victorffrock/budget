version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    # A branch de testes é a porta de entrada de qualquer mudança, inclusive
    # atualizações automáticas de dependências. A promoção para main só ocorre
    # após a validação completa da versão estável.
    target-branch: test
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      app-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /desktop
    target-branch: test
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Uma atualização direta pode exigir ajustes associados (por exemplo, a
    # permissão de scripts do Electron). Um único PR facilita essa revisão e a
    # preparação de uma candidata versionada.
    groups:
      desktop-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: test
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Actions que fazem parte da mesma cadeia de CI são revisadas juntas. Isso
    # também mantém init e analyze do CodeQL obrigatoriamente sincronizados.
    groups:
      workflow-actions:
        patterns:
          - "*"
