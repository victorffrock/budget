name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - icon.png
      - manifest.webmanifest
      - sw.js
      - .github/workflows/pages.yml
  workflow_dispatch:

# O deploy precisa apenas ler o repositório e publicar o artefato estático.
permissions:
  contents: read
  pages: write
  id-token: write

# Mantém um único deploy em andamento para que uma versão mais antiga nunca
# sobrescreva o site depois de uma publicação mais recente.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Preparar arquivos públicos
        run: |
          mkdir _site
          cp index.html icon.png manifest.webmanifest sw.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
