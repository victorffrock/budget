name: Validar projeto

on:
  # Tags não executam esta CI. Os próprios jobs abaixo criam a pré-release de
  # test somente depois das validações da branch protegida.
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Aplicação web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: node ../scripts/verify-release-version.cjs
      - run: git diff --exit-code -- budget.html ../index.html
      - run: node --check ../sw.js

  desktop:
    name: Dependências desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # No Electron 43 o pacote pode baixar o runtime apenas na primeira
      # execução do binário. Fazemos isso antes de ajustar o helper do sandbox.
      - name: Baixar runtime do Electron
        run: node node_modules/electron/install.js
      # O runner não preserva as permissões SUID do binário baixado pelo npm.
      # O Electron exige esse helper para executar seus testes com sandbox ativo.
      - name: Preparar sandbox do Electron
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm test
      - run: xvfb-run --auto-servernum npm run test:ui
      - run: npm audit --audit-level=high

  codeql-release:
    name: CodeQL para publicação
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analisar antes de publicar
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  appimage:
    name: AppImage atualizável (${{ matrix.appimage_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      BUDGET_APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Definir canal de build e atualização
        run: |
          build_channel=stable
          release_channel=latest
          appimage_name="Budget-$(node -p "require('./desktop/package.json').version")-$BUDGET_APPIMAGE_ARCH.AppImage"
          # O AppImage estável usa um nome de .zsync fixo. Assim, o Gear
          # Lever encontra a atualização na release mais recente mesmo quando
          # o nome do binário distribuído inclui a versão.
          update_zsync_name="Budget-$BUDGET_APPIMAGE_ARCH.AppImage.zsync"

          # Pushes na test — e PRs destinados a ela — validam exatamente o
          # artefato que será publicado no canal contínuo de testes.
          if [ "$GITHUB_REF_NAME" = "test" ] || [ "$GITHUB_BASE_REF" = "test" ]; then
            build_channel=test
            # O GithubUpdater do Gear Lever lista pré-releases somente com
            # este valor. A tag contínua "test" é um espelho para download,
            # não uma origem consultada pelo atualizador.
            release_channel=latest-pre
            appimage_name="Budget-test-$BUDGET_APPIMAGE_ARCH.AppImage"
            update_zsync_name="$appimage_name.zsync"
          fi

          {
            printf '%s\n' "BUDGET_BUILD_CHANNEL=$build_channel"
            printf '%s\n' "BUDGET_APPIMAGE_FILENAME=$appimage_name"
            printf '%s\n' "BUDGET_UPDATE_ZSYNC_FILENAME=$update_zsync_name"
            printf '%s\n' "APPIMAGE_UPDATE_INFORMATION=gh-releases-zsync|victorffrock|budget|$release_channel|$update_zsync_name"
          } >> "$GITHUB_ENV"
      - name: Instalar zsync
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsync
      - name: Instalar dependências da aplicação
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Gerar HTML offline
        working-directory: app
        run: |
          npm run build
          npm run verify
          git diff --exit-code -- budget.html ../index.html
      - name: Instalar dependências do desktop
        working-directory: desktop
        run: npm ci
      - name: Validar SBOMs
        run: |
          npm --prefix app sbom --sbom-format=cyclonedx --package-lock-only > /tmp/budget-app.sbom.cdx.json
          npm --prefix desktop sbom --sbom-format=cyclonedx --package-lock-only > /tmp/budget-desktop.sbom.cdx.json
          node -e "for (const file of process.argv.slice(1)) JSON.parse(require('node:fs').readFileSync(file, 'utf8'));" /tmp/budget-app.sbom.cdx.json /tmp/budget-desktop.sbom.cdx.json
      - name: Gerar e validar AppImage
        run: |
          ./scripts/build-appimage.sh "$BUDGET_APPIMAGE_ARCH"
          cmp app/budget.html desktop/index.html
          appimage="desktop/dist/$BUDGET_APPIMAGE_FILENAME"
          test -f "$appimage"
          test -x "$appimage"
          test -s "$appimage.zsync"
          docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-version
          update_info="$(docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-updateinformation)"
          test "$update_info" = "$APPIMAGE_UPDATE_INFORMATION"

  release-contract:
    name: Contrato de publicação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Exercita a regra que será aplicada novamente depois do upload da
      # release. Isto impede que um .zsync seja publicado sem o AppImage de
      # mesmo nome que o GithubUpdater do Gear Lever espera encontrar.
      - run: node --test scripts/test/*.test.cjs
      - name: Validar candidato destinado a test
        if: github.event_name == 'pull_request' && github.base_ref == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate="$(node scripts/verify-test-candidate.cjs \
            --base origin/test \
            --head "$GITHUB_SHA" \
            --mode pull-request)"

          if [ "$candidate" != stable ]; then
            echo "Candidato validado para o canal: $candidate."
            exit 0
          fi

          stable_version="$(node -p "require('./desktop/package.json').version")"
          node scripts/verify-release-version.cjs "v$stable_version" stable
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > /tmp/budget-releases.json
          tested_tag="$(node scripts/verify-tested-prerelease.cjs \
            "$stable_version" --tag-only < /tmp/budget-releases.json)"
          node scripts/verify-promoted-source.cjs "$tested_tag" "$GITHUB_SHA" origin/test
      - name: Garantir promoção integral do estado aprovado em test
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nenhuma correção, documentação ou automação começa em main. A
          # árvore inteira promovida precisa ser exatamente a test atual.
          git diff --quiet origin/test "$GITHUB_SHA" -- . || {
            echo 'ERRO: a pull request para main não corresponde integralmente à branch test.'
            exit 1
          }

          stable_version="$(node -p "require('./desktop/package.json').version")"
          node scripts/verify-release-version.cjs "v$stable_version" stable
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > /tmp/budget-releases.json
          tested_tag="$(node scripts/verify-tested-prerelease.cjs \
            "$stable_version" --tag-only < /tmp/budget-releases.json)"

          # A identificação da versão muda na promoção, mas a implementação e
          # as dependências precisam ser exatamente as exercitadas em test.
          node scripts/verify-promoted-source.cjs "$tested_tag" "$GITHUB_SHA" origin/test

  prepare-test-release:
    name: Preparar pré-release de teste
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    needs: [app, desktop, appimage, codeql-release, release-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: budget-test-release
      cancel-in-progress: false
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: release
        name: Criar tag e rascunho da pré-release quando necessário
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          printf '%s\n' 'publish=false' >> "$GITHUB_OUTPUT"

          candidate="$(node scripts/verify-test-candidate.cjs \
            --base "$BEFORE_SHA" \
            --head "$GITHUB_SHA" \
            --mode push)"

          if [ "$candidate" = skip ]; then
            echo 'Nenhum arquivo distribuído ou de publicação mudou; pré-release dispensada.'
            exit 0
          fi

          version="$(node -p "require('./desktop/package.json').version")"

          if [ "$candidate" = stable ]; then
            node scripts/verify-release-version.cjs "v$version" stable
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > /tmp/budget-releases.json
            tested_tag="$(node scripts/verify-tested-prerelease.cjs \
              "$version" --tag-only < /tmp/budget-releases.json)"
            node scripts/verify-promoted-source.cjs "$tested_tag" "$GITHUB_SHA" origin/test
            echo 'Versão estável corresponde à pré-release aprovada; aguardando promoção para main.'
            exit 0
          fi

          tag="v$version"
          node scripts/verify-release-version.cjs "$tag" test

          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "Pré-release $version" "$GITHUB_SHA"
            git push origin "$tag"
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > /tmp/budget-test-releases.json
          release_id="$(jq --arg tag "$tag" -r \
            '[.[] | select(.tag_name == $tag)][0].id // empty' \
            /tmp/budget-test-releases.json)"

          if [ -n "$release_id" ]; then
            release_state="$(node scripts/verify-github-release.cjs \
              --tag "$tag" --channel test --field state \
              < /tmp/budget-test-releases.json)"

            if [ "$release_state" = published ]; then
              for arch in x86_64 aarch64; do
                node scripts/verify-github-release.cjs \
                  --tag "$tag" --channel test --field assets \
                  < /tmp/budget-test-releases.json |
                  node scripts/verify-release-assets.cjs \
                    --channel test --arch "$arch" --version "$version"
              done
              echo "$tag já foi publicado com os dois pares de atualização."
              exit 0
            fi
          else
            jq -n \
              --arg tag "$tag" \
              --arg title "Budget $version — Teste" \
              '{
                tag_name:$tag,
                target_commitish:"test",
                name:$title,
                body:"Pré-release automatizada. Permanece invisível até os AppImages x86_64 e aarch64 passarem pela validação completa.",
                draft:true,
                prerelease:true
              }' > /tmp/budget-create-test-release.json
            gh api --method POST \
              --input /tmp/budget-create-test-release.json \
              "repos/$GITHUB_REPOSITORY/releases" \
              > /tmp/budget-created-test-release.json
            release_id="$(node scripts/verify-github-release.cjs \
              --tag "$tag" --channel test --require-draft --field id \
              < /tmp/budget-created-test-release.json)"
          fi

          printf '%s\n' 'publish=true' "tag=$tag" "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish-test-release:
    name: Publicar AppImage de teste
    needs: prepare-test-release
    if: needs.prepare-test-release.outputs.publish == 'true'
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.prepare-test-release.outputs.tag }}
      release_id: ${{ needs.prepare-test-release.outputs.release_id }}
      release_is_prerelease: true
      release_target: test
