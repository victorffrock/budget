name: Validar projeto

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Aplicação web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: node ../scripts/verify-release-version.cjs
      - run: git diff --exit-code -- somador-de-contas.html ../index.html
      - run: node --check ../sw.js

  desktop:
    name: Dependências desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # No Electron 43 o pacote pode baixar o runtime apenas na primeira
      # execução do binário. Fazemos isso antes de ajustar o helper do sandbox.
      - name: Baixar runtime do Electron
        run: node node_modules/electron/install.js
      # O runner não preserva as permissões SUID do binário baixado pelo npm.
      # O Electron exige esse helper para executar seus testes com sandbox ativo.
      - name: Preparar sandbox do Electron
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm test
      - run: xvfb-run --auto-servernum npm run test:ui
      - run: npm audit --audit-level=high

  appimage:
    name: AppImage atualizável
    runs-on: ubuntu-latest
    env:
      APPIMAGE_UPDATE_INFORMATION: gh-releases-zsync|victorffrock|somador-de-contas|latest|Somador-de-Contas-*-x86_64.AppImage.zsync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Instalar zsync
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsync
      - name: Instalar dependências da aplicação
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Gerar HTML offline
        working-directory: app
        run: |
          npm run build
          npm run verify
          git diff --exit-code -- somador-de-contas.html ../index.html
      - name: Instalar dependências do desktop
        working-directory: desktop
        run: npm ci
      - name: Validar SBOMs
        run: |
          npm --prefix app sbom --sbom-format=cyclonedx --package-lock-only > /tmp/somador-app.sbom.cdx.json
          npm --prefix desktop sbom --sbom-format=cyclonedx --package-lock-only > /tmp/somador-desktop.sbom.cdx.json
          node -e "for (const file of process.argv.slice(1)) JSON.parse(require('node:fs').readFileSync(file, 'utf8'));" /tmp/somador-app.sbom.cdx.json /tmp/somador-desktop.sbom.cdx.json
      - name: Gerar e validar AppImage
        run: |
          ./scripts/build-appimage.sh
          cmp app/somador-de-contas.html desktop/index.html
          appimage="$(find desktop/dist -maxdepth 1 -name '*.AppImage' -type f -print -quit)"
          test -n "$appimage"
          test -x "$appimage"
          test -s "$appimage.zsync"
          docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-version
          update_info="$(docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-updateinformation)"
          test "$update_info" = "$APPIMAGE_UPDATE_INFORMATION"
