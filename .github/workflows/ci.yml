name: Validar projeto

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Aplicação web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: node ../scripts/verify-release-version.cjs
      - run: git diff --exit-code -- budget.html ../index.html
      - run: node --check ../sw.js

  desktop:
    name: Dependências desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # No Electron 43 o pacote pode baixar o runtime apenas na primeira
      # execução do binário. Fazemos isso antes de ajustar o helper do sandbox.
      - name: Baixar runtime do Electron
        run: node node_modules/electron/install.js
      # O runner não preserva as permissões SUID do binário baixado pelo npm.
      # O Electron exige esse helper para executar seus testes com sandbox ativo.
      - name: Preparar sandbox do Electron
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm test
      - run: xvfb-run --auto-servernum npm run test:ui
      - run: npm audit --audit-level=high

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix app --ignore-scripts
      - run: npm ci --prefix mobile
      - run: npm --prefix mobile audit --audit-level=high
      - run: npm --prefix mobile test
      - run: npm --prefix mobile run sync
      - run: npm --prefix mobile run verify
      - run: npm --prefix mobile run build:debug
      - name: Validar APK de teste
        run: |
          apk='mobile/android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$apksigner"
          test -n "$aapt"
          "$apksigner" verify --verbose "$apk"
          "$aapt" dump badging "$apk" | grep "package: name='br.com.victorferreirafranco.budget.test'"
      - name: Disponibilizar APK de teste
        if: github.ref == 'refs/heads/test'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Budget-android-test-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  appimage:
    name: AppImage atualizável
    runs-on: ubuntu-latest
    env:
      APPIMAGE_UPDATE_INFORMATION: gh-releases-zsync|victorffrock|budget|latest|Budget-*-x86_64.AppImage.zsync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Instalar zsync
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsync
      - name: Instalar dependências da aplicação
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Gerar HTML offline
        working-directory: app
        run: |
          npm run build
          npm run verify
          git diff --exit-code -- budget.html ../index.html
      - name: Instalar dependências do desktop
        working-directory: desktop
        run: npm ci
      - name: Validar SBOMs
        run: |
          npm --prefix app sbom --sbom-format=cyclonedx --package-lock-only > /tmp/budget-app.sbom.cdx.json
          npm --prefix desktop sbom --sbom-format=cyclonedx --package-lock-only > /tmp/budget-desktop.sbom.cdx.json
          node -e "for (const file of process.argv.slice(1)) JSON.parse(require('node:fs').readFileSync(file, 'utf8'));" /tmp/budget-app.sbom.cdx.json /tmp/budget-desktop.sbom.cdx.json
      - name: Gerar e validar AppImage
        run: |
          ./scripts/build-appimage.sh
          cmp app/budget.html desktop/index.html
          appimage="$(find desktop/dist -maxdepth 1 -name '*.AppImage' -type f -print -quit)"
          test -n "$appimage"
          test -x "$appimage"
          test -s "$appimage.zsync"
          docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-version
          update_info="$(docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-updateinformation)"
          test "$update_info" = "$APPIMAGE_UPDATE_INFORMATION"
