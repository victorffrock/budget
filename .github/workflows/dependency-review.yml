name: Revisar dependências

on:
  pull_request:
    branches: [main, test]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependências seguras
    runs-on: ubuntu-latest
    steps:
      # Esta verificação impede que um pull request introduza dependências
      # conhecidas como vulneráveis antes de elas chegarem a uma branch protegida.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
