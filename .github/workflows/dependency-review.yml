name: Revisar dependências

on:
  pull_request:
    branches: [main, test]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependências seguras
    runs-on: ubuntu-latest
    steps:
      # Esta verificação impede que um pull request introduza dependências
      # conhecidas como vulneráveis antes de elas chegarem a uma branch protegida.
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
