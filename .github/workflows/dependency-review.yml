name: Revisar dependências

on:
  pull_request:
    branches: [main, test]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependências seguras
    runs-on: ubuntu-latest
    steps:
      # Esta verificação impede que um pull request introduza dependências
      # conhecidas como vulneráveis antes de elas chegarem a uma branch protegida.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
