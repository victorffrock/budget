name: Publicar AppImage

on:
  # Somente os workflows controlados de teste e promoção estável podem chamar
  # esta receita. A release permanece como rascunho até os dois AppImages e
  # seus arquivos .zsync passarem pela validação final.
  workflow_call:
    inputs:
      release_tag:
        description: Tag já criada para a release
        required: true
        type: string
      release_id:
        description: ID imutável do rascunho no GitHub
        required: true
        type: string
      release_is_prerelease:
        description: "true para o canal de testes; false para o estável"
        required: true
        type: boolean
      release_target:
        description: Branch de origem da release
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: budget-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  appimage:
    name: Gerar AppImage (${{ matrix.appimage_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      BUDGET_APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_IS_PRERELEASE: ${{ inputs.release_is_prerelease }}
      RELEASE_TARGET: ${{ inputs.release_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release deve sempre ser construída a partir da tag publicada,
          # nunca a partir do estado posterior da branch padrão.
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Instalar zsync
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsync
      - name: Validar origem, canal, tag e versões
        run: |
          release_channel=stable
          expected_target=main

          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            release_channel=test
            expected_target=test
          fi

          test "$RELEASE_TARGET" = "$expected_target" || {
            echo "ERRO: uma release $release_channel deve apontar para $expected_target, não para $RELEASE_TARGET."
            exit 1
          }

          node scripts/verify-release-version.cjs "$RELEASE_TAG" "$release_channel"
      - name: Exigir pré-release aprovada antes da versão estável
        if: env.RELEASE_IS_PRERELEASE == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          budget_version="$(node -p "require('./desktop/package.json').version")"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > /tmp/budget-releases.json
          node scripts/verify-tested-prerelease.cjs \
            "$budget_version" < /tmp/budget-releases.json
          tested_tag="$(node scripts/verify-tested-prerelease.cjs \
            "$budget_version" --tag-only < /tmp/budget-releases.json)"

          node scripts/verify-promoted-source.cjs "$tested_tag" "$RELEASE_TAG" origin/test
      - name: Definir canal e origem de atualização
        run: |
          build_channel=stable
          release_channel=latest
          # O artefato publicado e a origem de atualização compartilham um
          # único nome permanente. A versão já está registrada na tag, nos
          # metadados do aplicativo e no título da release.
          appimage_name="Budget-$BUDGET_APPIMAGE_ARCH.AppImage"
          update_zsync_name="$appimage_name.zsync"

          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            # O GithubUpdater do Gear Lever consulta todas as releases quando
            # recebe "latest-pre". A tag explícita "test" não é consultada
            # por esse mecanismo, embora continue sendo atualizada abaixo
            # como um canal contínuo para download manual.
            build_channel=test
            release_channel=latest-pre
            appimage_name="Budget-test-$BUDGET_APPIMAGE_ARCH.AppImage"
            update_zsync_name="$appimage_name.zsync"
          fi

          {
            printf '%s\n' "BUDGET_BUILD_CHANNEL=$build_channel"
            printf '%s\n' "BUDGET_APPIMAGE_FILENAME=$appimage_name"
            printf '%s\n' "APPIMAGE_UPDATE_INFORMATION=gh-releases-zsync|victorffrock|budget|$release_channel|$update_zsync_name"
          } >> "$GITHUB_ENV"
      - name: Instalar dependências da aplicação
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Gerar HTML offline
        working-directory: app
        run: |
          npm run build
          npm run verify
          git diff --exit-code -- budget.html ../index.html
      - name: Instalar dependências do desktop
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
      - name: Gerar AppImage
        run: |
          ./scripts/build-appimage.sh "$BUDGET_APPIMAGE_ARCH"
          cmp app/budget.html desktop/index.html
      - name: Validar atualização sem FUSE
        run: |
          appimage="desktop/dist/$BUDGET_APPIMAGE_FILENAME"
          test -f "$appimage"
          test -x "$appimage"
          test -s "$appimage.zsync"
          docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-version
          update_info="$(docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-updateinformation)"
          test "$update_info" = "$APPIMAGE_UPDATE_INFORMATION"
      - name: Gerar checksums
        run: |
          cd desktop/dist
          appimage="$BUDGET_APPIMAGE_FILENAME"
          app_sbom="SBOM-app-$BUDGET_APPIMAGE_ARCH.cdx.json"
          desktop_sbom="SBOM-desktop-$BUDGET_APPIMAGE_ARCH.cdx.json"
          checksum_file="SHA256SUMS-$BUDGET_APPIMAGE_ARCH.txt"
          npm --prefix ../../app sbom --sbom-format=cyclonedx --package-lock-only > "$app_sbom"
          npm --prefix .. sbom --sbom-format=cyclonedx --package-lock-only > "$desktop_sbom"
          node -e "for (const file of process.argv.slice(1)) JSON.parse(require('node:fs').readFileSync(file, 'utf8'));" "$app_sbom" "$desktop_sbom"
          sha256sum "$appimage" "$appimage.zsync" "$app_sbom" "$desktop_sbom" > "$checksum_file"
      - name: Atestar a procedência do AppImage
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: desktop/dist/Budget*-${{ matrix.appimage_arch }}.AppImage
      - name: Anexar AppImage e metadados de atualização
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Caminhos explícitos impedem que sobras do diretório de build ou
          # aliases acidentais sejam anexados à release.
          gh release upload "$RELEASE_TAG" \
            "desktop/dist/$BUDGET_APPIMAGE_FILENAME" \
            "desktop/dist/$BUDGET_APPIMAGE_FILENAME.zsync" \
            "desktop/dist/SBOM-app-$BUDGET_APPIMAGE_ARCH.cdx.json" \
            "desktop/dist/SBOM-desktop-$BUDGET_APPIMAGE_ARCH.cdx.json" \
            "desktop/dist/SHA256SUMS-$BUDGET_APPIMAGE_ARCH.txt" \
            --clobber
      - name: Verificar assets de atualização publicados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
            node scripts/verify-release-assets.cjs \
              --channel "$BUDGET_BUILD_CHANNEL" \
              --arch "$BUDGET_APPIMAGE_ARCH"

  finalize:
    name: Validar e tornar a release visível
    needs: appimage
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_IS_PRERELEASE: ${{ inputs.release_is_prerelease }}
      RELEASE_TARGET: ${{ inputs.release_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Confirmar rascunho e todos os assets obrigatórios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > /tmp/budget-release.json
          release_channel=stable
          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            release_channel=test
          fi

          verified_id="$(node scripts/verify-github-release.cjs \
            --tag "$RELEASE_TAG" \
            --channel "$release_channel" \
            --require-draft \
            --field id \
            < /tmp/budget-release.json)"
          test "$verified_id" = "$RELEASE_ID"

          for arch in x86_64 aarch64; do
            node scripts/verify-github-release.cjs \
              --tag "$RELEASE_TAG" \
              --channel "$release_channel" \
              --require-draft \
              --field assets \
              < /tmp/budget-release.json |
              node scripts/verify-release-assets.cjs \
                --channel "$release_channel" \
                --arch "$arch"
          done
      - name: Atualizar espelho contínuo do canal de testes
        if: inputs.release_is_prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_dir="$(mktemp -d)"

          download_asset() {
            asset_name="$1"
            asset_id="$(jq --arg name "$asset_name" -r \
              '[.assets[] | select(.name == $name)][0].id // empty' \
              /tmp/budget-release.json)"
            test -n "$asset_id" || {
              echo "ERRO: asset ausente no rascunho: $asset_name"
              exit 1
            }
            gh api \
              --header 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$artifact_dir/$asset_name"
          }

          for arch in x86_64 aarch64; do
            download_asset "Budget-test-$arch.AppImage"
            download_asset "Budget-test-$arch.AppImage.zsync"
            download_asset "SBOM-app-$arch.cdx.json"
            download_asset "SBOM-desktop-$arch.cdx.json"
            download_asset "SHA256SUMS-$arch.txt"
          done

          if ! gh release view test >/dev/null 2>&1; then
            gh release create test --prerelease --title "Budget — canal de testes" \
              --notes "Espelho contínuo para download manual. Use Budget-test-x86_64.AppImage em computadores Intel/AMD 64 bits ou Budget-test-aarch64.AppImage em ARM 64 bits." \
              --target test
          fi

          gh release upload test \
            "$artifact_dir/Budget-test-x86_64.AppImage" \
            "$artifact_dir/Budget-test-x86_64.AppImage.zsync" \
            "$artifact_dir/Budget-test-aarch64.AppImage" \
            "$artifact_dir/Budget-test-aarch64.AppImage.zsync" \
            "$artifact_dir/SBOM-app-x86_64.cdx.json" \
            "$artifact_dir/SBOM-desktop-x86_64.cdx.json" \
            "$artifact_dir/SHA256SUMS-x86_64.txt" \
            "$artifact_dir/SBOM-app-aarch64.cdx.json" \
            "$artifact_dir/SBOM-desktop-aarch64.cdx.json" \
            "$artifact_dir/SHA256SUMS-aarch64.txt" \
            --clobber

          for arch in x86_64 aarch64; do
            gh release view test --json assets --jq '.assets[].name' |
              node scripts/verify-release-assets.cjs \
                --channel test \
                --arch "$arch"
          done
      - name: Publicar somente depois da validação completa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --argjson prerelease "$RELEASE_IS_PRERELEASE" \
            --arg target "$RELEASE_TARGET" \
            '{draft:false, prerelease:$prerelease, target_commitish:$target}' \
            > /tmp/budget-publish-release.json
          gh api --method PATCH \
            --input /tmp/budget-publish-release.json \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > /tmp/budget-published-release.json
          release_channel=stable
          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            release_channel=test
          fi
          release_state="$(node scripts/verify-github-release.cjs \
            --tag "$RELEASE_TAG" --channel "$release_channel" --field state \
            < /tmp/budget-published-release.json)"
          test "$release_state" = published
