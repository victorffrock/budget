name: Publicar AppImage

on:
  release:
    # Rascunhos não devem gerar artefatos. A publicação é o momento em que a
    # tag fica pública e o AppImage pode ser anexado à release correta.
    types: [published]
  # A CI chama este mesmo processo depois de integrar uma versão inédita na
  # branch test. Isso evita manter uma segunda receita de empacotamento.
  workflow_call:
    inputs:
      release_tag:
        description: Tag já criada para a release
        required: true
        type: string
      release_is_prerelease:
        description: "true para o canal de testes; false para o estável"
        required: true
        type: string
      release_target:
        description: Branch de origem da release
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  appimage:
    name: Gerar AppImage (${{ matrix.appimage_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      BUDGET_APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      RELEASE_IS_PRERELEASE: ${{ inputs.release_is_prerelease || github.event.release.prerelease }}
      RELEASE_TARGET: ${{ inputs.release_target || github.event.release.target_commitish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release deve sempre ser construída a partir da tag publicada,
          # nunca a partir do estado posterior da branch padrão.
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Instalar zsync
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsync
      - name: Validar origem, canal, tag e versões
        run: |
          release_channel=stable
          expected_target=main

          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            release_channel=test
            expected_target=test
          fi

          test "$RELEASE_TARGET" = "$expected_target" || {
            echo "ERRO: uma release $release_channel deve apontar para $expected_target, não para $RELEASE_TARGET."
            exit 1
          }

          node scripts/verify-release-version.cjs "$RELEASE_TAG" "$release_channel"
      - name: Exigir pré-release aprovada antes da versão estável
        if: env.RELEASE_IS_PRERELEASE == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          budget_version="$(node -p "require('./desktop/package.json').version")"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > /tmp/budget-releases.json
          node scripts/verify-tested-prerelease.cjs \
            "$budget_version" < /tmp/budget-releases.json
          tested_tag="$(node scripts/verify-tested-prerelease.cjs \
            "$budget_version" --tag-only < /tmp/budget-releases.json)"

          node scripts/verify-promoted-source.cjs "$tested_tag" "$RELEASE_TAG"
      - name: Definir canal e origem de atualização
        run: |
          build_channel=stable
          release_channel=latest
          appimage_name="Budget-$(node -p "require('./desktop/package.json').version")-$BUDGET_APPIMAGE_ARCH.AppImage"
          # A origem de atualização precisa ter nome fixo: o AppImage antigo
          # só conhece esta referência e o Gear Lever a procura na release
          # mais recente. O binário versionado continua disponível para
          # download manual e histórico de releases.
          update_zsync_name="Budget-$BUDGET_APPIMAGE_ARCH.AppImage.zsync"

          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            # O GithubUpdater do Gear Lever consulta todas as releases quando
            # recebe "latest-pre". A tag explícita "test" não é consultada
            # por esse mecanismo, embora continue sendo atualizada abaixo
            # como um canal contínuo para download manual.
            build_channel=test
            release_channel=latest-pre
            appimage_name="Budget-test-$BUDGET_APPIMAGE_ARCH.AppImage"
            update_zsync_name="$appimage_name.zsync"
          fi

          {
            printf '%s\n' "BUDGET_BUILD_CHANNEL=$build_channel"
            printf '%s\n' "BUDGET_APPIMAGE_FILENAME=$appimage_name"
            printf '%s\n' "BUDGET_UPDATE_ZSYNC_FILENAME=$update_zsync_name"
            printf '%s\n' "APPIMAGE_UPDATE_INFORMATION=gh-releases-zsync|victorffrock|budget|$release_channel|$update_zsync_name"
          } >> "$GITHUB_ENV"
      - name: Instalar dependências da aplicação
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Gerar HTML offline
        working-directory: app
        run: |
          npm run build
          npm run verify
          git diff --exit-code -- budget.html ../index.html
      - name: Instalar dependências do desktop
        working-directory: desktop
        run: npm ci
      - name: Gerar AppImage
        run: |
          ./scripts/build-appimage.sh "$BUDGET_APPIMAGE_ARCH"
          cmp app/budget.html desktop/index.html
      - name: Preparar origem estável de atualização
        if: env.RELEASE_IS_PRERELEASE == 'false'
        run: |
          cd desktop/dist
          stable_appimage="Budget-$BUDGET_APPIMAGE_ARCH.AppImage"
          cp "$BUDGET_APPIMAGE_FILENAME" "$stable_appimage"
          cp "$BUDGET_APPIMAGE_FILENAME.zsync" "$BUDGET_UPDATE_ZSYNC_FILENAME"

          # As versões distribuídas antes da correção usavam um nome de
          # .zsync versionado. O GithubUpdater do Gear Lever localiza o
          # binário removendo apenas o sufixo ".zsync", sem interpretar a
          # URL registrada dentro desse arquivo. Por isso, cada alias precisa
          # publicar o par completo (AppImage e .zsync) com o nome histórico.
          # Ambos contêm a versão atual e servem somente como ponte para que
          # instalações 6.1.3 e 6.1.4 alcancem o canal estável de nome fixo.
          for legacy_version in 6.1.3 6.1.4; do
            cp "$BUDGET_APPIMAGE_FILENAME" "Budget-$legacy_version-$BUDGET_APPIMAGE_ARCH.AppImage"
            cp "$BUDGET_APPIMAGE_FILENAME.zsync" "Budget-$legacy_version-$BUDGET_APPIMAGE_ARCH.AppImage.zsync"
            cmp "$BUDGET_APPIMAGE_FILENAME" "Budget-$legacy_version-$BUDGET_APPIMAGE_ARCH.AppImage"
          done

          cmp "$BUDGET_APPIMAGE_FILENAME" "$stable_appimage"
          cmp "$BUDGET_APPIMAGE_FILENAME.zsync" "$BUDGET_UPDATE_ZSYNC_FILENAME"
      - name: Validar atualização sem FUSE
        run: |
          appimage="desktop/dist/$BUDGET_APPIMAGE_FILENAME"
          test -f "$appimage"
          test -x "$appimage"
          test -s "$appimage.zsync"
          docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-version
          update_info="$(docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-updateinformation)"
          test "$update_info" = "$APPIMAGE_UPDATE_INFORMATION"
      - name: Gerar checksums
        run: |
          cd desktop/dist
          appimage="$BUDGET_APPIMAGE_FILENAME"
          app_sbom="SBOM-app-$BUDGET_APPIMAGE_ARCH.cdx.json"
          desktop_sbom="SBOM-desktop-$BUDGET_APPIMAGE_ARCH.cdx.json"
          checksum_file="SHA256SUMS-$BUDGET_APPIMAGE_ARCH.txt"
          npm --prefix ../../app sbom --sbom-format=cyclonedx --package-lock-only > "$app_sbom"
          npm --prefix .. sbom --sbom-format=cyclonedx --package-lock-only > "$desktop_sbom"
          node -e "for (const file of process.argv.slice(1)) JSON.parse(require('node:fs').readFileSync(file, 'utf8'));" "$app_sbom" "$desktop_sbom"
          sha256sum Budget*-$BUDGET_APPIMAGE_ARCH.AppImage Budget*-$BUDGET_APPIMAGE_ARCH.AppImage.zsync "$app_sbom" "$desktop_sbom" > "$checksum_file"
      - name: Atestar a procedência do AppImage
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: desktop/dist/Budget*-${{ matrix.appimage_arch }}.AppImage
      - name: Anexar AppImage e metadados de atualização
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mantém o binário versionado para download manual. Nas releases
          # estáveis, inclui também a cópia de nome fixo usada pelo Gear Lever.
          set -- \
            desktop/dist/Budget-*-$BUDGET_APPIMAGE_ARCH.AppImage \
            desktop/dist/Budget-*-$BUDGET_APPIMAGE_ARCH.AppImage.zsync \
            desktop/dist/SBOM-*-$BUDGET_APPIMAGE_ARCH.cdx.json \
            desktop/dist/SHA256SUMS-$BUDGET_APPIMAGE_ARCH.txt

          if [ "$BUDGET_BUILD_CHANNEL" = stable ]; then
            set -- "$@" \
              "desktop/dist/Budget-$BUDGET_APPIMAGE_ARCH.AppImage" \
              "desktop/dist/Budget-$BUDGET_APPIMAGE_ARCH.AppImage.zsync"
          fi

          gh release upload "$RELEASE_TAG" "$@" --clobber
      - name: Verificar assets de atualização publicados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          budget_version="$(node -p "require('./desktop/package.json').version")"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
            node scripts/verify-release-assets.cjs \
              --channel "$BUDGET_BUILD_CHANNEL" \
              --arch "$BUDGET_APPIMAGE_ARCH" \
              --version "$budget_version"
      - name: Atualizar canal contínuo de testes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BUDGET_BUILD_CHANNEL" != "test" ]; then
            echo "Release estável: canal contínuo de testes não será alterado."
            exit 0
          fi

          # As duas arquiteturas executam em paralelo. Se a outra matriz criar
          # a release entre a consulta e a criação, a confirmação abaixo ainda
          # permite que ambas enviem seus arquivos independentes.
          if ! gh release view test >/dev/null 2>&1; then
            gh release create test --prerelease --title "Budget — canal de testes" \
              --notes "Canal contínuo de atualização para AppImages de teste." \
              --target "$GITHUB_SHA" || gh release view test >/dev/null
          fi

          gh release upload test \
            "desktop/dist/$BUDGET_APPIMAGE_FILENAME" \
            "desktop/dist/$BUDGET_APPIMAGE_FILENAME.zsync" \
            "desktop/dist/SBOM-app-$BUDGET_APPIMAGE_ARCH.cdx.json" \
            "desktop/dist/SBOM-desktop-$BUDGET_APPIMAGE_ARCH.cdx.json" \
            "desktop/dist/SHA256SUMS-$BUDGET_APPIMAGE_ARCH.txt" \
            --clobber

          budget_version="$(node -p "require('./desktop/package.json').version")"
          gh release view test --json assets --jq '.assets[].name' |
            node scripts/verify-release-assets.cjs \
              --channel test \
              --arch "$BUDGET_APPIMAGE_ARCH" \
              --version "$budget_version"
