name: Publicar AppImage

on:
  release:
    # Rascunhos não devem gerar artefatos. A publicação é o momento em que a
    # tag fica pública e o AppImage pode ser anexado à release correta.
    types: [published]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  appimage:
    name: Gerar AppImage
    runs-on: ubuntu-latest
    env:
      APPIMAGE_UPDATE_INFORMATION: gh-releases-zsync|victorffrock|somador-de-contas|latest|Somador-de-Contas-*-x86_64.AppImage.zsync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - name: Instalar zsync
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsync
      - name: Validar tag e versões
        run: node scripts/verify-release-version.cjs "${{ github.event.release.tag_name }}"
      - name: Instalar dependências da aplicação
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Gerar HTML offline
        working-directory: app
        run: |
          npm run build
          npm run verify
          git diff --exit-code -- somador-de-contas.html ../index.html
      - name: Instalar dependências do desktop
        working-directory: desktop
        run: npm ci
      - name: Gerar AppImage
        run: |
          ./scripts/build-appimage.sh
          cmp app/somador-de-contas.html desktop/index.html
      - name: Validar atualização sem FUSE
        run: |
          appimage="$(find desktop/dist -maxdepth 1 -name '*.AppImage' -type f -print -quit)"
          test -n "$appimage"
          test -x "$appimage"
          test -s "$appimage.zsync"
          docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-version
          update_info="$(docker run --rm --cap-drop=ALL --security-opt no-new-privileges \
            -v "$PWD/desktop/dist:/dist:ro" ubuntu:24.04 \
            "/dist/$(basename "$appimage")" --appimage-updateinformation)"
          test "$update_info" = "$APPIMAGE_UPDATE_INFORMATION"
      - name: Gerar checksums
        run: |
          cd desktop/dist
          npm --prefix ../../app sbom --sbom-format=cyclonedx --package-lock-only > SBOM-app.cdx.json
          npm --prefix .. sbom --sbom-format=cyclonedx --package-lock-only > SBOM-desktop.cdx.json
          node -e "for (const file of process.argv.slice(1)) JSON.parse(require('node:fs').readFileSync(file, 'utf8'));" SBOM-app.cdx.json SBOM-desktop.cdx.json
          sha256sum *.AppImage *.AppImage.zsync *.cdx.json > SHA256SUMS.txt
      - name: Atestar a procedência do AppImage
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: desktop/dist/*.AppImage
      - name: Anexar AppImage e metadados de atualização
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" desktop/dist/*.AppImage desktop/dist/*.AppImage.zsync desktop/dist/*.cdx.json desktop/dist/SHA256SUMS.txt --clobber
