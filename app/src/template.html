<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somador de Contas</title>
<style>
  /*
    Paleta e tipografia seguem o GNOME Human Interface Guidelines
    (developer.gnome.org/hig) — cores da paleta padrão do GNOME,
    fonte de sistema (Adwaita Sans / Cantarell), sem itálico, sem
    caixa alta, cantos e espaçamento no estilo Libadwaita.
  */
  :root{
    /* GNOME HIG standard palette */
    --blue-1:#99c1f1; --blue-2:#62a0ea; --blue-3:#3584e4; --blue-4:#1c71d8; --blue-5:#1a5fb4;
    --green-4:#2ec27e; --green-5:#26a269;
    --yellow-5:#e5a50a;
    --orange-4:#e66100;
    --red-1:#f66151; --red-3:#e01b24; --red-4:#c01c28;
    --light-1:#ffffff; --light-2:#f6f5f4; --light-3:#deddda; --light-4:#c0bfbc; --light-5:#9a9996;
    --dark-1:#77767b; --dark-2:#5e5c64; --dark-3:#3d3846; --dark-4:#241f31;

    --window-bg:var(--light-2);
    --view-bg:var(--light-1);
    --headerbar-bg:var(--light-2);
    --border:var(--light-3);
    --text:var(--dark-4);
    --text-dim:var(--dark-1);
    --accent:var(--blue-3);
    --accent-hover:var(--blue-4);
    --destructive:var(--red-3);
    --destructive-hover:var(--red-4);

    --radius-window:12px;
    --radius-row:6px;
    --font: -apple-system, 'Adwaita Sans', 'Cantarell', 'Segoe UI', 'Ubuntu', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--window-bg);
    color:var(--text);
    font-family:var(--font);
    font-size:14px;
    line-height:1.45;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  .app-window{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--window-bg);
  }
  @media (min-width:520px){
    .app-window{
      min-height:auto;
      margin:28px auto;
      border-radius:var(--radius-window);
      border:1px solid var(--border);
      box-shadow:0 1px 2px rgba(0,0,0,.04), 0 12px 28px -12px rgba(0,0,0,.22);
      overflow:hidden;
    }
  }

  body.is-desktop{
    background:var(--window-bg);
    align-items:stretch;
    justify-content:stretch;
  }
  body.is-desktop .app-window{
    max-width:none;
    min-height:100vh;
    margin:0;
    border:none;
    border-radius:0;
    box-shadow:none;
  }

  .headerbar{
    height:47px;
    flex:none;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    background:var(--headerbar-bg);
    border-bottom:1px solid var(--border);
    padding:0 10px;
  }
  body.is-desktop .headerbar{
    -webkit-app-region: drag;
    app-region: drag;
    user-select:none;
  }
  .hb-start{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .hb-start img{ width:18px; height:18px; border-radius:4px; }
  .hb-title{
    grid-column:2;
    margin:0;
    text-align:center;
    font-size:14.5px;
    font-weight:700;
    color:var(--text);
    white-space:nowrap;
  }
  .hb-end{
    grid-column:3;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:2px;
  }
  .win-btn{
    display:none;
    width:28px;
    height:28px;
    border:none;
    border-radius:6px;
    background:transparent;
    color:var(--text-dim);
    cursor:pointer;
    align-items:center;
    justify-content:center;
    -webkit-app-region: no-drag;
    app-region: no-drag;
  }
  body.is-desktop .win-btn{ display:inline-flex; }
  .win-btn:hover{ background:var(--light-3); color:var(--text); }
  .win-btn.close:hover{ background:var(--destructive); color:#fff; }
  .win-btn svg{ width:14px; height:14px; }

  .content{
    flex:1;
    padding:18px 16px 20px;
    display:flex;
    flex-direction:column;
    gap:16px;
    position:relative;
  }
  .content.dragging::after{
    content:"";
    position:absolute;
    inset:8px;
    border:2px dashed var(--accent);
    border-radius:10px;
    background:rgba(53,132,228,0.06);
    pointer-events:none;
  }

  .status-page{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:36px 20px;
    gap:4px;
  }
  .status-icon{
    width:64px;
    height:64px;
    color:var(--light-4);
    margin-bottom:10px;
  }
  .status-title{
    margin:0;
    font-size:16px;
    font-weight:700;
    color:var(--text);
  }
  .status-desc{
    margin:2px 0 18px;
    max-width:30ch;
    font-size:13px;
    color:var(--text-dim);
  }

  .btn{
    font-family:var(--font);
    font-size:13.5px;
    font-weight:600;
    border-radius:var(--radius-row);
    border:1px solid var(--border);
    background:var(--view-bg);
    color:var(--text);
    padding:8px 16px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn:hover{ background:var(--light-2); }
  .btn:active{ background:var(--light-3); }
  .btn.suggested{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn.suggested:hover{ background:var(--accent-hover); border-color:var(--accent-hover); }
  .btn.pill{ border-radius:999px; }
  .btn.flat{
    background:transparent;
    border-color:transparent;
    font-weight:600;
  }
  .btn.flat:hover{ background:var(--light-3); }
  .btn.destructive-text{ color:var(--destructive); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn:disabled:hover{ background:var(--view-bg); }
  .btn svg{ width:15px; height:15px; flex:none; }

  input[type=file]{ display:none; }

  .boxed-list{
    background:var(--view-bg);
    border:1px solid var(--border);
    border-radius:var(--radius-window);
    overflow:hidden;
  }
  .list-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-bottom:1px solid var(--border);
  }
  .list-row:last-child{ border-bottom:none; }

  .row-status{
    width:18px; height:18px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .row-status svg{ width:16px; height:16px; }
  .row-status.ok svg{ color:var(--green-5); }
  .row-status.warn svg{ color:var(--yellow-5); }
  .row-status.err svg{ color:var(--destructive); }
  .row-status.spin svg{ color:var(--light-5); animation:spin 1s linear infinite; }
  @media (prefers-reduced-motion: reduce){ .row-status.spin svg{ animation:none; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .row-title{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .row-title .fname{
    font-size:13.5px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row-title .fsub{
    font-size:11.5px;
    color:var(--text-dim);
  }

  .row-value{
    font-variant-numeric:tabular-nums;
    font-size:14px;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
    cursor:text;
    padding:3px 4px;
    border-radius:4px;
  }
  .row-value:hover{ background:var(--light-2); }
  .row-value input{
    font-family:var(--font);
    font-variant-numeric:tabular-nums;
    font-size:14px;
    font-weight:600;
    color:var(--text);
    text-align:right;
    width:82px;
    border:none;
    border-bottom:1.5px solid var(--accent);
    background:transparent;
    outline:none;
    padding:0;
  }

  .row-remove{
    flex:none;
    width:26px; height:26px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .row-remove:hover{ background:var(--light-3); color:var(--destructive); }
  .row-remove svg{ width:14px; height:14px; }

  .add-row{
    cursor:pointer;
    color:var(--accent);
    font-weight:600;
    font-size:13.5px;
  }
  .add-row:hover{ background:var(--light-2); }
  .add-row svg{ width:16px; height:16px; color:var(--accent); }

  .summary-card{
    background:var(--view-bg);
    border:1px solid var(--border);
    border-radius:var(--radius-window);
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .summary-label{
    font-size:12.5px;
    color:var(--text-dim);
  }
  .summary-value{
    font-variant-numeric:tabular-nums;
    font-size:24px;
    font-weight:800;
    color:var(--text);
    flex:1;
    text-align:right;
    padding-right:4px;
  }
  .summary-value .currency-symbol{
    font-size:14px;
    font-weight:700;
    color:var(--text-dim);
    margin-right:4px;
  }

  .trust{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:var(--text-dim);
    font-size:11.5px;
    padding-top:2px;
  }
  .trust svg{ width:13px; height:13px; flex:none; color:var(--green-5); }
</style>
</head>
<body>

<div class="app-window">

  <header class="headerbar">
    <div class="hb-start">
      <img id="hbIcon" alt="" src="">
    </div>
    <h1 class="hb-title">Somador de Contas</h1>
    <div class="hb-end">
      <button type="button" class="win-btn" id="btnMinimize" title="Minimizar" aria-label="Minimizar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8h10"/></svg>
      </button>
      <button type="button" class="win-btn close" id="btnClose" title="Fechar" aria-label="Fechar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </header>

  <main class="content" id="content">

    <div class="status-page" id="statusPage">
      <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3h10a1 1 0 011 1v16.2c0 .5-.6.8-1 .5l-2-1.4-2 1.4a.9.9 0 01-1 0l-2-1.4-2 1.4a.9.9 0 01-1 0l-2-1.4-2 1.4c-.4.3-1 0-1-.5V4a1 1 0 011-1z"/>
        <path d="M9 8h6M9 11.5h6M9 15h3.5"/>
      </svg>
      <h2 class="status-title">Nenhuma conta ainda</h2>
      <p class="status-desc">Arraste arquivos PDF para esta janela, ou escolha os arquivos manualmente.</p>
      <button class="btn suggested pill" id="chooseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Escolher arquivos…
      </button>
    </div>

    <div class="boxed-list" id="boxedList" hidden>
      <div id="rows"></div>
      <div class="list-row add-row" id="addRow" tabindex="0" role="button" aria-label="Adicionar mais boletos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Adicionar boletos…</span>
      </div>
    </div>

    <div class="summary-card" id="summaryCard" hidden>
      <div class="summary-label" id="countLabel">0 contas</div>
      <div class="summary-value"><span class="currency-symbol">R$</span><span id="totalValue">0,00</span></div>
      <button class="btn flat destructive-text" id="clearBtn">Limpar</button>
    </div>

    <p class="trust">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="5" y="11" width="14" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 018 0v4"/>
      </svg>
      processado 100% no seu computador — nenhum arquivo sai daqui
    </p>

    <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple>
  </main>

</div>

<script>

<script>
(function(){
  "use strict";

  var workerBlob = new Blob([window.__PDF_WORKER_SRC__], {type:'application/javascript'});
  pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(workerBlob);

  var APP_ICON_DATA_URI = "__APP_ICON_DATA_URI__";
  document.getElementById('hbIcon').src = APP_ICON_DATA_URI;

  if (window.somadorDesktop && window.somadorDesktop.isDesktop) {
    document.body.classList.add('is-desktop');
    var btnMin = document.getElementById('btnMinimize');
    var btnClose = document.getElementById('btnClose');
    if (btnMin) btnMin.addEventListener('click', function(){ window.somadorDesktop.minimize(); });
    if (btnClose) btnClose.addEventListener('click', function(){ window.somadorDesktop.close(); });
  }

  var state = { items: [] };
  var nextId = 1;

  var contentEl = document.getElementById('content');
  var statusPage = document.getElementById('statusPage');
  var boxedList = document.getElementById('boxedList');
  var rowsEl = document.getElementById('rows');
  var addRow = document.getElementById('addRow');
  var chooseBtn = document.getElementById('chooseBtn');
  var fileInput = document.getElementById('fileInput');
  var summaryCard = document.getElementById('summaryCard');
  var countLabel = document.getElementById('countLabel');
  var totalValueEl = document.getElementById('totalValue');
  var clearBtn = document.getElementById('clearBtn');

  var ICONS = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.3 2.3L16 10"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 21 20H3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>',
    err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 014.9.6c0 1.6-2.2 1.9-2.4 3.4"/><circle cx="12" cy="16.8" r="0.6" fill="currentColor" stroke="none"/></svg>',
    remove: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    spinner: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 100 18"/></svg>'
  };

  function fmtBRL(n){
    return n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function parseBRLNumber(str){
    if(!str) return null;
    var cleaned = String(str).trim().replace(/[^0-9.,]/g,'');
    if(!cleaned) return null;
    if(cleaned.indexOf(',') !== -1){
      cleaned = cleaned.replace(/\./g,'').replace(',', '.');
    }
    var n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
  }

  function normalizeText(text){
    return String(text || '')
      .replace(/\u00a0/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase();
  }

  function extractFromText(fullText){
    var result = { amount:null, confidence:'err', due:null };
    var norm = normalizeText(fullText);

    var numPattern = '(?<!\\d)(\\d{1,3}(?:\\.\\d{3})*,\\d{2})(?!\\d)';
    var gap = '[^0-9a-zà-ú]{0,12}(?:r\\$[^0-9a-zà-ú]{0,12})?';

    var rules = [
      { score:100, re:new RegExp('valor\\s*a\\s*pagar' + gap + numPattern, 'i') },
      { score:98,  re:new RegExp('total\\s*a\\s*pagar' + gap + numPattern, 'i') },
      { score:96,  re:new RegExp('valor\\s*cobrado' + gap + numPattern, 'i') },
      { score:94,  re:new RegExp('pagamento\\s*total\\s*da\\s*fatura' + gap + numPattern, 'i') },
      { score:92,  re:new RegExp('valor\\s*total\\s*da\\s*fatura' + gap + numPattern, 'i') },
      { score:90,  re:new RegExp('total\\s*da\\s*fatura' + gap + numPattern, 'i') },
      { score:88,  re:new RegExp('total\\s*desta\\s*fatura' + gap + numPattern, 'i') },
      { score:80,  re:new RegExp('valor\\s*total' + gap + numPattern, 'i') },
      { score:78,  re:new RegExp('total\\s*geral' + gap + numPattern, 'i') },
      { score:65,  re:new RegExp('valor\\s*do\\s*documento' + gap + numPattern, 'i') },
      { score:50,  re:new RegExp('^\\s*valor' + gap + numPattern, 'im') }
    ];

    var candidates = [];
    for(var i=0;i<rules.length;i++){
      var m = norm.match(rules[i].re);
      if(m){
        var amount = parseBRLNumber(m[1]);
        if(typeof amount === 'number' && isFinite(amount)){
          candidates.push({ amount:amount, score:rules[i].score });
        }
      }
    }

    if(candidates.length){
      candidates.sort(function(a,b){ return b.score - a.score; });
      var best = candidates[0];
      var tied = candidates.filter(function(c){ return c.score === best.score; });
      var distinctTied = {};
      tied.forEach(function(c){ distinctTied[c.amount.toFixed(2)] = true; });
      if(Object.keys(distinctTied).length === 1){
        result.amount = best.amount;
        result.confidence = best.score >= 90 ? 'ok' : 'warn';
      }
    }

    if(result.amount === null){
      var all = norm.match(new RegExp(numPattern,'g')) || [];
      var unique = {};
      all.forEach(function(v){
        var n = parseBRLNumber(v);
        if(typeof n === 'number' && isFinite(n) && n >= 1) unique[n.toFixed(2)] = n;
      });
      var keys = Object.keys(unique);
      if(keys.length === 1){
        result.amount = unique[keys[0]];
        result.confidence = 'warn';
      } else if(keys.length > 1){
        var sorted = keys.map(function(k){ return unique[k]; }).sort(function(a,b){ return b-a; });
        if(sorted[0] > sorted[1] * 1.5){
          result.amount = sorted[0];
          result.confidence = 'warn';
        }
      }
    }

    var dueMatch = norm.match(/vencimento[^0-9]{0,15}(\d{2}\/\d{2}\/\d{4})/i);
    if(dueMatch) result.due = dueMatch[1];

    return result;
  }
    async function readPdfText(file){
    var buf = await file.arrayBuffer();
    // isEvalSupported: false mitiga a vulnerabilidade de execução de JS
    // em PDFs maliciosos (CVE-2024-4367), mesmo em versões antigas do pdf.js.
    var loadingTask = pdfjsLib.getDocument({
      data: buf,
      isEvalSupported: false
    });
    var pdf = await loadingTask.promise;
    var fullText = '';
    var pagesToRead = pdf.numPages;
    for(var p=1; p<=pagesToRead; p++){
      var page = await pdf.getPage(p);
      var content = await page.getTextContent();
      var lastY = null;
      var line = '';
      for(var i=0;i<content.items.length;i++){
        var it = content.items[i];
        var y = it.transform ? it.transform[5] : null;
        if(lastY !== null && y !== null && Math.abs(y - lastY) > 2){
          fullText += line + '\n';
          line = '';
        }
        line += it.str + ' ';
        lastY = y;
      }
      fullText += line + '\n';
    }
    return fullText;
  }

  function render(){
    rowsEl.innerHTML = '';
    var n = state.items.length;

    statusPage.hidden = n > 0;
    boxedList.hidden = n === 0;
    summaryCard.hidden = n === 0;

    state.items.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'list-row';

      var statusEl = document.createElement('div');
      if(item.status === 'processing'){
        statusEl.className = 'row-status spin';
        statusEl.innerHTML = ICONS.spinner;
      } else {
        statusEl.className = 'row-status ' + item.confidence;
        statusEl.innerHTML = ICONS[item.confidence] || ICONS.err;
        statusEl.title = item.confidence === 'ok' ? 'Valor identificado com segurança'
          : item.confidence === 'warn' ? 'Valor identificado por heurística — confira'
          : 'Não identificado — confira o valor';
      }
      row.appendChild(statusEl);

      var titleEl = document.createElement('div');
      titleEl.className = 'row-title';
      var fname = document.createElement('div');
      fname.className = 'fname';
      fname.textContent = item.filename;
      fname.title = item.filename;
      titleEl.appendChild(fname);

      var sub = document.createElement('div');
      sub.className = 'fsub';
      sub.textContent = item.status === 'processing' ? 'lendo…' : (item.due ? 'vence ' + item.due : '');
      if(sub.textContent) titleEl.appendChild(sub);
      row.appendChild(titleEl);

      var valueEl = document.createElement('div');
      valueEl.className = 'row-value';
      if(item.status === 'processing'){
        valueEl.textContent = '…';
      } else {
        valueEl.textContent = fmtBRL(item.amount || 0);
        valueEl.tabIndex = 0;
        valueEl.setAttribute('role','button');
        valueEl.setAttribute('aria-label', 'Editar valor de ' + item.filename);
        valueEl.addEventListener('click', function(){ startEdit(item.id); });
        valueEl.addEventListener('keydown', function(e){
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); startEdit(item.id); }
        });
      }
      row.appendChild(valueEl);

      var rm = document.createElement('button');
      rm.className = 'row-remove';
      rm.setAttribute('aria-label', 'Remover ' + item.filename);
      rm.innerHTML = ICONS.remove;
      rm.addEventListener('click', function(){ removeItem(item.id); });
      row.appendChild(rm);

      rowsEl.appendChild(row);
    });

    var total = state.items.reduce(function(sum, it){
      return sum + (typeof it.amount === 'number' ? it.amount : 0);
    }, 0);
    totalValueEl.textContent = fmtBRL(total);
    countLabel.textContent = n === 1 ? '1 conta' : n + ' contas';
  }

  function startEdit(id){
    var item = state.items.find(function(it){ return it.id === id; });
    if(!item) return;
    var idx = state.items.indexOf(item);
    var valueEl = rowsEl.children[idx].querySelector('.row-value');
    var current = typeof item.amount === 'number' ? fmtBRL(item.amount) : '';
    valueEl.innerHTML = '';
    var input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'decimal';
    input.value = current;
    input.setAttribute('aria-label', 'Valor de ' + item.filename);
    valueEl.appendChild(input);
    input.focus();
    input.select();

    var cancelled = false;
    function commit(){
      if(cancelled) return;
      var raw = input.value.trim();
      if(raw === ''){
        render();
        return;
      }
      var val = parseBRLNumber(raw);
      if(val === null || val < 0){
        alert('Valor inválido. Digite um número no formato brasileiro (ex.: 123,45). O valor anterior foi mantido.');
        render();
        return;
      }
      item.amount = val;
      item.confidence = 'ok';
      item.status = 'ok';
      render();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); input.blur(); }
      if(e.key === 'Escape'){ e.preventDefault(); cancelled = true; render(); }
    });
  }

  function removeItem(id){
    state.items = state.items.filter(function(it){ return it.id !== id; });
    render();
  }

  async function addFiles(fileList){
    var files = Array.prototype.filter.call(fileList, function(f){
      return f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    });
    if(!files.length) return;

    var pending = files.map(function(f){
      return { id: nextId++, filename: f.name, amount:null, due:null, status:'processing', confidence:'err' };
    });
    state.items = state.items.concat(pending);
    render();

    for(var i=0;i<files.length;i++){
      var file = files[i];
      var item = pending[i];
      try{
        var text = await readPdfText(file);
        var extracted = extractFromText(text);
        item.amount = extracted.amount;
        item.confidence = extracted.confidence;
        item.due = extracted.due;
        item.status = 'ok';
      } catch(err){
        item.amount = null;
        item.confidence = 'err';
        item.status = 'ok';
      }
      render();
    }
  }

  chooseBtn.addEventListener('click', function(){ fileInput.click(); });
  addRow.addEventListener('click', function(){ fileInput.click(); });
  addRow.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener('change', function(){
    addFiles(fileInput.files);
    fileInput.value = '';
  });

  ['dragenter','dragover'].forEach(function(evt){
    contentEl.addEventListener(evt, function(e){
      e.preventDefault(); e.stopPropagation();
      contentEl.classList.add('dragging');
    });
  });
  ['dragleave','drop'].forEach(function(evt){
    contentEl.addEventListener(evt, function(e){
      e.preventDefault(); e.stopPropagation();
      if(evt === 'dragleave' && e.target !== contentEl) return;
      contentEl.classList.remove('dragging');
    });
  });
  contentEl.addEventListener('drop', function(e){
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
      addFiles(e.dataTransfer.files);
    }
  });

  clearBtn.addEventListener('click', function(){
    state.items = [];
    render();
  });

  render();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
